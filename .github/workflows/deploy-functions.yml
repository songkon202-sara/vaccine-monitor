name: Deploy Edge Functions

# เมื่อแก้โค้ดใน supabase/functions แล้ว push ขึ้น main จะ deploy ให้อัตโนมัติ
# ต้องตั้ง GitHub Secrets 2 ตัว: SUPABASE_ACCESS_TOKEN และ SUPABASE_PROJECT_ID
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          for fn in ingest check-alerts line-webhook manage-staff; do
            supabase functions deploy "$fn" --no-verify-jwt --project-ref "$SUPABASE_PROJECT_ID"
          done
